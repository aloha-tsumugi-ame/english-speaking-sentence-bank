<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="実際の英会話で言いたかった英文を日付・話題別にまとめた音読用Sentence Bank">
  <title>English Speaking Sentence Bank</title>
  <style>
    :root {
      --bg: #f5f7f6;
      --paper: #ffffff;
      --ink: #18211d;
      --muted: #69756f;
      --line: #dde5e0;
      --green: #176b4b;
      --green-dark: #0d5036;
      --green-pale: #e7f3ed;
      --lime: #d3eb7b;
      --orange: #e77642;
      --shadow: 0 16px 42px rgba(17, 67, 45, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 0%, rgba(211,235,123,.28), transparent 31rem),
        radial-gradient(circle at 94% 13%, rgba(23,107,75,.11), transparent 27rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
      line-height: 1.65;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1020px, calc(100% - 32px)); margin-inline: auto; }
    .hero { padding: 62px 0 35px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px;
      color: var(--green); font-size: .78rem; font-weight: 850;
      letter-spacing: .13em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 27px; height: 3px; border-radius: 2px; background: var(--lime); }
    h1 { margin: 13px 0 13px; font-size: clamp(2.5rem, 6vw, 5.2rem); line-height: .99; letter-spacing: -.055em; }
    h1 span { color: var(--green); }
    .lead { max-width: 680px; margin: 0; color: var(--muted); font-size: clamp(.98rem, 2vw, 1.12rem); }
    .stats { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 25px; }
    .stat { padding: 8px 12px; border: 1px solid rgba(23,107,75,.14); border-radius: 999px; background: rgba(255,255,255,.68); color: var(--green-dark); font-size: .82rem; font-weight: 800; }
    .toolbar-wrap { position: sticky; top: 0; z-index: 20; padding: 10px 0 11px; border-block: 1px solid rgba(221,229,224,.78); background: rgba(245,247,246,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .toolbar { display: grid; grid-template-columns: minmax(240px, 1fr) auto; gap: 9px; }
    .search { position: relative; }
    .search input { width: 100%; height: 48px; padding: 0 45px 0 44px; border: 1px solid var(--line); border-radius: 14px; outline: 0; background: var(--paper); box-shadow: 0 5px 18px rgba(20,67,46,.04); }
    .search input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(23,107,75,.11); }
    .search svg { position: absolute; left: 15px; top: 50%; width: 18px; translate: 0 -50%; color: var(--muted); }
    .shortcut { position: absolute; right: 12px; top: 50%; translate: 0 -50%; padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; background: #f8faf9; color: var(--muted); font-size: .73rem; }
    .actions { display: flex; gap: 8px; }
    .btn, .chip { border: 1px solid var(--line); background: var(--paper); cursor: pointer; transition: .18s ease; }
    .btn { height: 48px; padding-inline: 14px; border-radius: 14px; font-weight: 750; white-space: nowrap; }
    .btn.primary { border-color: var(--green); background: var(--green); color: #fff; }
    .btn:hover, .chip:hover { border-color: #a8bcb0; transform: translateY(-1px); }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-top: 11px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; color: var(--muted); font-size: .82rem; font-weight: 800; }
    .chip.active { border-color: var(--green); background: var(--green); color: #fff; }
    .utility { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 21px 0 0; }
    .result { margin: 0; color: var(--muted); font-size: .87rem; }
    .toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .81rem; font-weight: 700; cursor: pointer; }
    .toggle input { accent-color: var(--green); }
    main { padding-bottom: 78px; }
    .date-block { margin-top: 44px; scroll-margin-top: 150px; }
    .date-head { display: flex; align-items: end; justify-content: space-between; gap: 15px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
    .date-label { margin: 0; font-size: clamp(1.7rem, 4vw, 2.65rem); line-height: 1.1; letter-spacing: -.035em; }
    .date-count { color: var(--muted); font-size: .82rem; font-weight: 750; }
    .topic { margin-top: 28px; scroll-margin-top: 150px; }
    .topic-head { display: flex; gap: 13px; align-items: center; margin-bottom: 12px; }
    .topic-no { display: grid; place-items: center; width: 35px; height: 35px; flex: 0 0 auto; border-radius: 11px; background: var(--green); color: white; font-weight: 900; }
    .topic-title { margin: 0; font-size: clamp(1.18rem, 2.6vw, 1.52rem); letter-spacing: -.02em; }
    .topic-size { margin-left: auto; color: var(--muted); font-size: .78rem; }
    .sentence-list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--paper); box-shadow: var(--shadow); }
    .sentence-row { display: grid; grid-template-columns: 37px minmax(0, 1fr) 34px; gap: 12px; align-items: start; padding: 14px 15px; border-bottom: 1px solid var(--line); transition: .16s; }
    .sentence-row:last-child { border-bottom: 0; }
    .sentence-row:hover { background: #f8fbf9; }
    .sentence-row.done { background: #f6f8f7; }
    .sentence-row.done .sentence { color: #8c9691; }
    .check { width: 27px; height: 27px; display: grid; place-items: center; padding: 0; border: 1px solid #cbd7d0; border-radius: 9px; background: #fff; color: transparent; cursor: pointer; font-size: .78rem; font-weight: 900; }
    .done .check { border-color: var(--green); background: var(--green); color: #fff; }
    .sentence-wrap { min-width: 0; }
    .sentence-number { display: inline-block; min-width: 2.1em; margin-right: 5px; color: var(--green); font-size: .78rem; font-weight: 900; vertical-align: .1em; }
    .sentence { font-family: ui-serif, Georgia, "Times New Roman", serif; font-size: clamp(1.04rem, 2vw, 1.19rem); font-weight: 600; line-height: 1.45; }
    .speak { width: 31px; height: 31px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--green); cursor: pointer; }
    .speak:hover { border-color: var(--green); background: var(--green-pale); }
    mark { padding: 0 .08em; border-radius: 4px; background: #fff09a; color: inherit; }
    .empty { display: none; max-width: 560px; margin: 58px auto; padding: 34px; border: 1px dashed #b9c8c0; border-radius: 18px; text-align: center; color: var(--muted); background: rgba(255,255,255,.62); }
    .empty strong { display: block; margin-bottom: 3px; color: var(--ink); }
    footer { padding: 23px 0 44px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
    .to-top { position: fixed; right: 22px; bottom: 22px; z-index: 25; width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--green); color: #fff; box-shadow: 0 10px 28px rgba(13,80,54,.26); cursor: pointer; opacity: 0; translate: 0 10px; pointer-events: none; transition: .2s; }
    .to-top.show { opacity: 1; translate: 0; pointer-events: auto; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 22px, 1020px); }
      .hero { padding: 42px 0 28px; }
      .toolbar { grid-template-columns: 1fr; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      .shortcut { display: none; }
      .date-block { margin-top: 36px; }
      .sentence-row { grid-template-columns: 31px minmax(0,1fr) 31px; gap: 8px; padding: 13px 11px; }
      .check { width: 25px; height: 25px; }
      .utility { align-items: flex-start; flex-direction: column; }
    }
    @media print {
      body { background: #fff; font-size: 10pt; }
      .hero { padding: 15px 0; }
      h1 { font-size: 30pt; }
      .toolbar-wrap, .utility, .check, .speak, .to-top { display: none !important; }
      .shell { width: 100%; }
      .date-block { break-before: page; margin-top: 0; }
      .date-block:first-child { break-before: auto; }
      .topic { break-inside: avoid; margin-top: 17px; }
      .sentence-list { box-shadow: none; }
      .sentence-row { grid-template-columns: 1fr; padding: 7px 10px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="hero shell">
    <div class="eyebrow">Personal speaking practice</div>
    <h1>English Speaking<br><span>Sentence Bank</span></h1>
    <p class="lead">実際の会話で言いたかった内容を、自然な英語に直して蓄積。読むだけでなく、声に出して次の会話で使える状態にするためのリストです。</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar-wrap">
    <div class="shell">
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="search" type="search" placeholder="英文・トピックを検索" autocomplete="off" aria-label="英文を検索">
          <span class="shortcut">/</span>
        </label>
        <div class="actions">
          <button class="btn" id="randomBtn" type="button">ランダム1文</button>
          <button class="btn primary" id="printBtn" type="button">印刷 / PDF</button>
        </div>
      </div>
      <nav class="filters" id="filters" aria-label="日付フィルター"></nav>
    </div>
  </div>

  <main class="shell">
    <div class="utility">
      <p class="result" id="result" aria-live="polite"></p>
      <label class="toggle"><input id="hideDone" type="checkbox"> チェック済みを隠す</label>
    </div>
    <div id="content"></div>
    <div class="empty" id="empty"><strong>一致する英文がありません</strong>検索語や日付を変えてみてください。</div>
  </main>

  <footer><div class="shell">English Speaking Sentence Bank · Updated __UPDATED_LABEL__</div></footer>
  <button class="to-top" id="toTop" type="button" aria-label="ページ上部へ">↑</button>

  <script>
  const bank = __SENTENCE_BANK_DATA__;

  const state = { date: "all", query: "", hideDone: false };
  const storageKey = "english-sentence-bank-completed-v1";
  let completed = new Set(JSON.parse(localStorage.getItem(storageKey) || "[]"));
  const allSentences = bank.flatMap(day => day.topics.flatMap((topic, topicIndex) => topic.sentences.map(([number, text], sentenceIndex) => ({
    id: `${day.date}-${topicIndex + 1}-${sentenceIndex + 1}`,
    date: day.date, topic: topic.title, topicIndex, number, text
  }))));
  const totalTopics = bank.reduce((sum, day) => sum + day.topics.length, 0);
  const content = document.getElementById("content");
  const search = document.getElementById("search");
  const filters = document.getElementById("filters");
  const result = document.getElementById("result");
  const empty = document.getElementById("empty");
  const speakerIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18 6a9 9 0 0 1 0 12"></path></svg>';

  let englishVoices = [];
  function refreshEnglishVoices() {
    if (!("speechSynthesis" in window)) return;
    englishVoices = speechSynthesis.getVoices().filter(voice => /^en([-_]|$)/i.test(voice.lang));
  }
  function naturalEnglishVoice() {
    const preferredNames = [
      /Google US English/i,
      /Microsoft Aria.*Natural/i,
      /Microsoft Jenny.*Natural/i,
      /Samantha/i,
      /Ava.*(Premium|Enhanced)?/i,
      /Alex/i,
      /Daniel/i
    ];
    for (const pattern of preferredNames) {
      const match = englishVoices.find(voice => pattern.test(voice.name));
      if (match) return match;
    }
    const nonNoveltyVoices = englishVoices.filter(voice => !/(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Fred|Good News|Hysterical|Pipe Organ|Trinoids|Whisper|Wobble|Zarvox)/i.test(voice.name));
    return nonNoveltyVoices.find(voice => /^en-US/i.test(voice.lang)) || nonNoveltyVoices[0] || null;
  }
  refreshEnglishVoices();
  if ("speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged", refreshEnglishVoices);

  const escapeHtml = (value = "") => String(value).replace(/[&<>\"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
  const normalize = value => String(value || "").toLowerCase().normalize("NFKC");
  const formatDate = date => new Intl.DateTimeFormat("en-US", { year: "numeric", month: "long", day: "numeric" }).format(new Date(date + "T00:00:00"));

  function highlight(text) {
    const safe = escapeHtml(text);
    const query = state.query.trim();
    if (!query) return safe;
    const escaped = query.replace(/[.*+?^$()|[\]\\]/g, "\\$&");
    return safe.replace(new RegExp(`(${escaped})`, "gi"), "<mark>$1</mark>");
  }

  function visibleItems() {
    const q = normalize(state.query.trim());
    return allSentences.filter(item =>
      (state.date === "all" || item.date === state.date) &&
      (!q || normalize(item.text + " " + item.topic).includes(q)) &&
      (!state.hideDone || !completed.has(item.id))
    );
  }

  function renderFilters() {
    const options = [["all", "すべて"], ...bank.map(day => [day.date, day.date])];
    filters.innerHTML = options.map(([value, label]) => `<button type="button" class="chip ${state.date === value ? "active" : ""}" data-date="${value}">${label}</button>`).join("");
    filters.querySelectorAll("[data-date]").forEach(button => button.addEventListener("click", () => {
      state.date = button.dataset.date;
      renderFilters();
      render();
    }));
  }

  function render() {
    const visible = visibleItems();
    const visibleIds = new Set(visible.map(item => item.id));
    content.innerHTML = bank.map(day => {
      if (state.date !== "all" && state.date !== day.date) return "";
      const topics = day.topics.map((topic, topicIndex) => {
        const rows = topic.sentences.map(([number, text], sentenceIndex) => {
          const id = `${day.date}-${topicIndex + 1}-${sentenceIndex + 1}`;
          if (!visibleIds.has(id)) return "";
          const done = completed.has(id);
          return `<li class="sentence-row ${done ? "done" : ""}" data-id="${id}">
            <button type="button" class="check" data-check="${id}" aria-label="習得チェック">✓</button>
            <div class="sentence-wrap"><span class="sentence-number">${number}.</span><span class="sentence">${highlight(text)}</span></div>
            <button type="button" class="speak" data-speak="${escapeHtml(text)}" aria-label="英文を読み上げる">${speakerIcon}</button>
          </li>`;
        }).join("");
        if (!rows) return "";
        const topicVisible = topic.sentences.filter((_, sentenceIndex) => visibleIds.has(`${day.date}-${topicIndex + 1}-${sentenceIndex + 1}`)).length;
        return `<section class="topic" id="${day.date}-topic-${topicIndex + 1}">
          <div class="topic-head"><span class="topic-no">${topicIndex + 1}</span><h3 class="topic-title">${highlight(topic.title)}</h3><span class="topic-size">${topicVisible} sentences</span></div>
          <ol class="sentence-list">${rows}</ol>
        </section>`;
      }).join("");
      if (!topics) return "";
      const dayCount = visible.filter(item => item.date === day.date).length;
      return `<section class="date-block" id="date-${day.date}">
        <div class="date-head"><h2 class="date-label">${formatDate(day.date)}</h2><span class="date-count">${dayCount} sentences</span></div>${topics}
      </section>`;
    }).join("");
    result.textContent = `${allSentences.length}文中 ${visible.length}文を表示 · チェック済み ${completed.size}文`;
    empty.style.display = visible.length ? "none" : "block";
    bindRows();
  }

  function bindRows() {
    document.querySelectorAll("[data-check]").forEach(button => button.addEventListener("click", () => {
      const id = button.dataset.check;
      completed.has(id) ? completed.delete(id) : completed.add(id);
      localStorage.setItem(storageKey, JSON.stringify([...completed]));
      render();
    }));
    document.querySelectorAll("[data-speak]").forEach(button => button.addEventListener("click", () => {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(button.dataset.speak);
      const voice = naturalEnglishVoice();
      if (voice) utterance.voice = voice;
      utterance.lang = voice?.lang || "en-US";
      utterance.rate = .92;
      utterance.pitch = 1;
      utterance.volume = 1;
      speechSynthesis.speak(utterance);
    }));
  }

  document.getElementById("stats").innerHTML = `<span class="stat">${allSentences.length} sentences</span><span class="stat">${totalTopics} topics</span><span class="stat">${bank.length} sessions</span>`;
  search.addEventListener("input", event => { state.query = event.target.value; render(); });
  document.getElementById("hideDone").addEventListener("change", event => { state.hideDone = event.target.checked; render(); });
  document.getElementById("printBtn").addEventListener("click", () => window.print());
  document.getElementById("randomBtn").addEventListener("click", () => {
    const pool = allSentences.filter(item => state.date === "all" || item.date === state.date);
    const item = pool[Math.floor(Math.random() * pool.length)];
    state.query = item.text;
    search.value = item.text;
    render();
    requestAnimationFrame(() => document.querySelector(`[data-id="${item.id}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" }));
  });
  document.addEventListener("keydown", event => {
    if (event.key === "/" && document.activeElement !== search) { event.preventDefault(); search.focus(); }
    if (event.key === "Escape" && document.activeElement === search) { search.value = ""; state.query = ""; render(); search.blur(); }
  });
  const toTop = document.getElementById("toTop");
  addEventListener("scroll", () => toTop.classList.toggle("show", scrollY > 700), { passive: true });
  toTop.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
  renderFilters();
  render();
  </script>
</body>
</html>
